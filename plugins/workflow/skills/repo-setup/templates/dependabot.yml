# Keep only the ecosystems the project uses. Remove every `target-branch: dev` line while the project has no dev branch (stage 1).
# Security updates ignore target-branch: they always open against main and are handled like hotfixes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # NuGet doesn't tell dev dependencies apart, so every update is a fix(deps).
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      nuget:
        patterns: ["*"]

  # npm also covers pnpm (it reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
