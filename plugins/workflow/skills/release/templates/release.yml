name: Release

on:
  push:
    branches: [main]
  # Publishes an existing release again (stage 4), for when publishing failed after the tag was created.
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish again, without the "v" (for example 1.4.0)
        required: true

# Every job asks for what it needs; the default is read-only.
permissions:
  contents: read

# One release at a time. A second merge waits for the first release to finish.
concurrency:
  group: release
  cancel-in-progress: false

# Actions are pinned to commit hashes: these jobs handle the release bot's key and publish packages.
jobs:
  release:
    name: Release
    # The bot's own release commit triggers this workflow again; there's nothing to release in it.
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}

    steps:
      # The release bot (a GitHub App) can push to main and opens pull requests that trigger CI.
      - name: Get the release bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # Computes the version, writes it to the source files and CHANGELOG.md, commits to main, tags, creates the GitHub Release.
      - name: Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          npx --yes
          -p semantic-release@25
          -p @semantic-release/changelog@7
          -p @semantic-release/exec@7
          -p @semantic-release/git@11
          -p conventional-changelog-conventionalcommits@10
          semantic-release

      # Brings the release commit back to dev. Merged automatically once CI passes.
      - name: Open the main → dev pull request
        if: steps.semantic-release.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.semantic-release.outputs.version }}
        run: |
          if [ -n "$(gh pr list --base dev --head main --state open --json number --jq '.[].number')" ]; then
            echo "A main → dev pull request is already open; it carries this release too."
            exit 0
          fi
          url=$(gh pr create --base dev --head main \
            --title "chore: sync main into dev after v$VERSION" \
            --body "Brings the release commit of v$VERSION back to dev. Merged automatically, with a merge commit, once CI passes.")
          gh pr merge "$url" --auto --merge

  # Stage 4. Delete this job if the project publishes no packages; keep only the steps of its targets.
  publish:
    name: Publish
    needs: release
    if: always() && (needs.release.outputs.version != '' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # trusted publishing (nuget.org, npmjs)
      packages: write   # GitHub Packages
    env:
      VERSION: ${{ needs.release.outputs.version || inputs.version }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ env.VERSION }}
          persist-credentials: false

      # ---- .NET -----------------------------------------------------------------

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The version comes from Directory.Build.props, already bumped in the tagged commit.
      - name: Pack
        run: dotnet pack --configuration Release --output ./packages

      # nuget.org, with trusted publishing. NUGET_USER is your nuget.org username (a repository variable).
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "./packages/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # GitHub Packages.
      - name: Push to GitHub Packages (NuGet)
        run: dotnet nuget push "./packages/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate

      # ---- Node -----------------------------------------------------------------

      # npmjs, with trusted publishing (needs npm 11.5.1 or newer).
      - name: Setup Node for npmjs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Publish to npmjs
        run: |
          npm install --global npm@latest
          npm publish --access public

      # GitHub Packages. The package name must be scoped to the owner (@owner/name).
      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com

      - name: Publish to GitHub Packages (npm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
